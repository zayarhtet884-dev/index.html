<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ဆန်းကျမ်း - အင်္ဂဝိဇ္ဇာ အခါတိုင်</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f9f9f9;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h2 {
            color: #b30000;
        }
        .taing-wrapper {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .taing-box {
            border: 2px solid #b30000;
            border-radius: 6px;
            padding: 10px;
            width: 100px;
            background: #fff;
        }
        .taing-title {
            color: #b30000;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .number-cell {
            background: #fff;
            border: 1px solid #ddd;
            margin: 5px 0;
            padding: 8px;
            font-weight: bold;
            color: #0044cc;
        }
        /* အခါတိုင်အတွက် မျဉ်းသားပုံစံ */
        .akhar-line {
            border: none;
            height: 2px;
            background-color: #0044cc;
            width: 80%;
            margin: 4px auto;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>ဆန်းကျမ်း - အင်္ဂဝိဇ္ဇာ</h2>
    <p>မွေးနံတိုင်၊ ကောဇာတိုင် နှင့် အခါတိုင် (အင်္ဂဝိဇ္ဇာ)</p>

    <div class="taing-wrapper" id="taing-container">
        <!-- ဂျာဗားစကရစ်ဖြင့် တိုင်များကို ဤနေရာတွင် ထည့်သွင်းမည် -->
    </div>
</div>

<script>
    // နေ့အလိုက် အင်္ဂဝိဇ္ဇာ အခါဂဏန်း စဉ်ဆက်များ
    const daySequences = {
        "တနင်္ဂနွေ": [1, 6, 4, 2, 0, 5, 3, 1],
        "တနင်္လာ": [2, 0, 5, 3, 1, 6, 4, 2],
        "အင်္ဂါ": [3, 1, 6, 4, 2, 0, 5, 3],
        "ဗုဒ္ဓဟူး": [4, 2, 0, 5, 3, 1, 6, 4],
        "ကြာသပတေး": [5, 3, 1, 6, 4, 2, 0, 5],
        "သောကြာ": [6, 4, 2, 0, 5, 3, 1, 6],
        "စနေ": [0, 5, 3, 1, 6, 4, 2, 0]
    };

    // ဥပမာ - စနေနေ့အတွက် ၇ မြောက်အခါ (index 6) ကို တွက်ချက်ပြသခြင်း
    function renderAkkharTaing(dayName, slotIndex) {
        const container = document.getElementById("taing-container");
        const seq = daySequences[dayName];
        if (!seq) return;

        let targetNum = seq[slotIndex]; // မျဉ်းတားရမည့် အခါနံပါတ်

        // အခါတိုင် HTML တည်ဆောက်ရန်
        let html = `
            <div class="taing-box">
                <div class="taing-title">အခါတိုင်</div>
        `;

        seq.forEach((num, idx) => {
            if (idx === slotIndex) {
                // အခါကျရောက်သောနေရာကို အပေါ်အောက် မျဉ်းတားရန်
                html += `<div class="number-cell"><hr class="akhar-line">${num}<hr class="akhar-line"></div>`;
            } else {
                html += `<div class="number-cell">${num}</div>`;
            }
        });

        html += `</div>`;
        container.innerHTML += html;
    }

    // စမ်းသပ်ရန် - စနေနေ့ (၇ မြောက်အခါ) ကို ထည့်သွင်းပြသခြင်း
    renderAkkharTaing("စနေ", 6);
</script>

</body>
</html>
