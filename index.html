<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>နာမက္ခရတိုင် တွက်ချက်မှု</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #fdfbf7;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .title {
            color: #a00;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        /* တိုင်ပုံစံ (Pyramid / Pillar Box) */
        .pillar-box {
            border: 1px solid #d4af37;
            border-radius: 6px;
            padding: 15px;
            margin: 15px auto;
            width: 220px;
            background: #fff;
        }
        .pillar-title {
            color: #d81b60;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .pillar-top {
            font-size: 18px;
            color: #d81b60;
            font-weight: bold;
            margin-bottom: 5px;
            padding-bottom: 5px;
            border-bottom: 2px solid #000;
            width: 50px;
            margin-left: auto;
            margin-right: auto;
        }
        .pillar-row {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 5px 0;
            padding-bottom: 5px;
            border-bottom: 1px solid #000;
            width: 140px;
            margin-left: auto;
            margin-right: auto;
        }
        .pillar-row:last-of-type {
            border-bottom: 2px solid #000;
        }
        .pillar-cell {
            font-size: 18px;
            color: #d81b60;
            font-weight: bold;
            width: 30px;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="title">နာမက္ခရတိုင် တွက်ချက်ခြင်း</div>
        
        <!-- မူလဇယား (သို့မဟုတ် အချက်အလက်ပြရန်) -->
        <div id="mula-section">
            <!-- ဤနေရာတွင် မူလဇယားရှိမည် -->
        </div>

        <!-- မူလအောက်တွင် ထည့်ရမည့် တိုင်ပုံစံ -->
        <div class="pillar-box">
            <div class="pillar-title" id="remainder-title">အကြွင်း (၁) တိုင်</div>
            <div class="pillar-top" id="p-top">၀</div>
            <div class="pillar-row">
                <span class="pillar-cell" id="p1-left">၆</span>
                <span class="pillar-cell" id="p1-right">၅</span>
            </div>
            <div class="pillar-row">
                <span class="pillar-cell" id="p2-left">၄</span>
                <span class="pillar-cell" id="p2-right">၃</span>
            </div>
            <div class="pillar-row">
                <span class="pillar-cell" id="p3-left">၂</span>
                <span class="pillar-cell" id="p3-right">၁</span>
            </div>
        </div>
    </div>

    <script>
        // ဥပမာ - မွေးခုနှစ်ကို ၇ ဖြင့်စား၍ အကြွင်းရှာပုံ (သို့မဟုတ် လိုအပ်သလို ချိတ်ဆက်ရန်)
        function updatePillar(remainder) {
            // အကြွင်းအလိုက် ဂဏန်းပုံစံများ (ဆရာပြထားသော ပုံများအတိုင်း)
            const patterns = {
                1: { top: '၀', r1: ['၆', '၅'], r2: ['၄', '၃'], r3: ['၂', '၁'] },
                2: { top: '၁', r2_l: '၀', r2_r: '၆', r3_l: '၅', r3_r: '၄', r4_l: '၃', r4_r: '၂' }, // လိုအပ်သလို ပုံစံအတိုင်း အစားထိုးနိုင်ပါသည်
                // ကျန်အကြွင်းများကို ဆရာပြထားသည့်အတိုင်း ထည့်သွင်းနိုင်သည်
            };

            // DOM Elements များကို ချိတ်ဆက်ရန်
            document.getElementById('remainder-title').innerText = `အကြွင်း (${remainder}) တိုင်`;
        }

        // စမ်းသပ်ရန် အကြွင်း ၁ ထည့်ထားခြင်း
        updatePillar(1);
    </script>

</body>
</html>
